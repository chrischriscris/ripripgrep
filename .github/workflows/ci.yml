name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --workspace --all-targets --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install pinned ripgrep oracle
        run: |
          cargo +stable install ripgrep --version 15.2.0 --locked --root "$RUNNER_TEMP/rrg-oracle"
          echo "$RUNNER_TEMP/rrg-oracle/bin" >> "$GITHUB_PATH"
      - name: Verify ripgrep oracle
        run: |
          rg --version
          test "$(rg --version | head -n 1)" = "ripgrep 15.2.0"
      - run: cargo +stable test --workspace --locked
        env:
          RRG_REQUIRE_RG: '1'
      - run: python3 scripts/check-terminal.py target/debug/rrg
      - run: cargo +stable build --release --locked
      - run: ./target/release/rrg --help
